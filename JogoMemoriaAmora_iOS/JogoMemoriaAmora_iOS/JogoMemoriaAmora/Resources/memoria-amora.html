<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 Jogo de Memória da Amora — 8 Pares</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #fff5e6, #ffe4c4);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
        }
        h1 {
            font-size: 1.6rem;
            color: #8b4513;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .subtitulo {
            color: #a0522d;
            margin-bottom: 1rem;
            text-align: center;
        }
        .info {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            color: #5a3817;
            font-weight: 500;
        }
        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 400px;
            margin-bottom: 1.5rem;
        }
        .carta {
            width: 85px;
            height: 85px;
            border-radius: 14px;
            background: linear-gradient(145deg, #deb887, #d2b48c);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 3px solid #b8860b;
            box-shadow: 0 4px 8px rgba(139,69,19,0.25);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .carta img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 10px;
        }
        .carta.virada {
            background: #fff8dc;
            border-color: #daa520;
            transform: scale(1.05);
        }
        .carta.virada img {
            display: block;
        }
        .carta.combinada {
            background: #f0fff0;
            border-color: #32cd32;
            cursor: default;
            animation: brilho 0.8s ease;
        }
        @keyframes brilho {
            0% { box-shadow: 0 0 10px rgba(50,205,50,0.4); }
            50% { box-shadow: 0 0 25px rgba(50,205,50,0.8); }
            100% { box-shadow: 0 0 10px rgba(50,205,50,0.4); }
        }
        .carta:hover:not(.virada):not(.combinada) {
            transform: scale(1.08);
            border-color: #ffd700;
        }
        .carta .verso {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .virada .verso {
            display: none;
        }
        .botoes {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        button {
            padding: 0.9rem 2rem;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-novo {
            background: linear-gradient(135deg, #ffd700, #f4a460);
            color: #5a3817;
            font-weight: bold;
        }
        .btn-novo:hover {
            transform: scale(1.05);
        }
        .mensagem {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            color: #2e8b57;
            text-align: center;
            min-height: 50px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<h1>🐾 Jogo de Memória da Amora 🐶</h1>
<p class="subtitulo">8 pares — 16 casas — feito com carinho 💛</p>

<div class="info">
    <div>✅ Pares: <span id="pares">0/8</span></div>
    <div>🔄 Tentativas: <span id="tentativas">0</span></div>
</div>

<div class="tabuleiro" id="tabuleiro"></div>

<div class="botoes">
    <button class="btn-novo" onclick="iniciarJogo()">🔄 Novo Jogo</button>
</div>

<div class="mensagem" id="mensagem">Encontre os pares das cachorrinhas! 🐶✨</div>

<script>
// === 8 FOTOS DAS CACHORRINHAS ===
const fotos = [
    'cachorra1.jpg',
    'cachorra2.jpg',
    'cachorra3.jpg',
    'cachorra4.jpg',
    'cachorra5.jpg',
    'cachorra6.jpg',
    'cachorra7.jpg',
    'cachorra8.jpg'
];

let cartas = [...fotos, ...fotos]; // cada foto = 2 peças → 16 no total
let carta1 = null;
let carta2 = null;
let bloqueado = false;
let paresEncontrados = 0;
let tentativas = 0;

function embaralhar(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function montarTabuleiro() {
    const tab = document.getElementById('tabuleiro');
    tab.innerHTML = '';
    cartas = embaralhar([...fotos, ...fotos]);
    paresEncontrados = 0;
    tentativas = 0;
    carta1 = null;
    carta2 = null;
    bloqueado = false;
    atualizarInfo();
    document.getElementById('mensagem').textContent = 'Encontre os pares das cachorrinhas! 🐶✨';

    cartas.forEach((foto) => {
        const carta = document.createElement('div');
        carta.className = 'carta';
        carta.dataset.foto = foto;
        carta.innerHTML = `
            <div class="verso">🐾</div>
            <img src="${foto}" alt="Cachorrinha" onerror="this.parentElement.style.background='#ffcccc'">
        `;
        carta.onclick = () => virarCarta(carta);
        tab.appendChild(carta);
    });
}

function virarCarta(carta) {
    if (bloqueado) return;
    if (carta === carta1) return;
    if (carta.classList.contains('virada') || carta.classList.contains('combinada')) return;

    carta.classList.add('virada');

    if (!carta1) {
        carta1 = carta;
        return;
    }

    carta2 = carta;
    tentativas++;
    atualizarInfo();
    bloqueado = true;

    verificarCombinacao();
}

function verificarCombinacao() {
    if (carta1.dataset.foto === carta2.dataset.foto) {
        carta1.classList.add('combinada');
        carta2.classList.add('combinada');
        paresEncontrados++;
        atualizarInfo();
        limparSelecao();

        if (paresEncontrados === fotos.length) {
            document.getElementById('mensagem').innerHTML = 
                `🎉 Parabéns! Você encontrou todas em ${tentativas} tentativas!<br>As 8 cachorrinhas da Amora estão todas juntinhas! 🐶💛✨`;
        }
    } else {
        setTimeout(() => {
            carta1.classList.remove('virada');
            carta2.classList.remove('virada');
            limparSelecao();
        }, 1200);
    }
}

function limparSelecao() {
    [carta1, carta2] = [null, null];
    bloqueado = false;
}

function atualizarInfo() {
    document.getElementById('pares').textContent = `${paresEncontrados}/${fotos.length}`;
    document.getElementById('tentativas').textContent = tentativas;
}

function iniciarJogo() {
    montarTabuleiro();
}

montarTabuleiro();
</script>

</body>
</html>
